# Local Security Scanner configuration.
# Copy to config.yaml (install.ps1 / `python run_scan.py init` does this without overwriting).
# Windows paths: use single quotes or forward slashes in YAML, e.g. 'D:\Projects' or D:/Projects

repository_roots: []          # e.g. ['D:\Projects', 'C:\Work\repos']
excluded_dirs: [node_modules, .venv, venv, dist, build, .next, .nuxt, __pycache__, .idea, .vscode, coverage, reports, logs]
max_depth: 10                 # how deep to search below each root
follow_symlinks: false        # never follow directory symlinks/junctions by default
capture_git_metadata: true    # read current branch + HEAD commit (read-only git commands)
log_level: INFO

paths:                        # relative paths are resolved against the project folder
  data_dir: data              # SQLite database + lock files
  reports_dir: reports        # raw Trivy/Gitleaks JSON reports + exports
  logs_dir: logs

scan:
  timeout_seconds: 1800       # per scanner invocation
  concurrency: 1              # repositories scanned in parallel (1-8)
  severities: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]
  offline: false              # true = never download DBs; use cached Trivy DB only
  db_freshness_hours: 72      # older DB => STALE warning
  retention_days: 0           # 0 = keep all history; N = prune runs older than N days after each batch
  skip_dirs: [.venv, venv, node_modules, __pycache__, .tox, .mypy_cache, .pytest_cache, .ruff_cache]
                              # folders skipped INSIDE repos by Trivy + Gitleaks (installed deps/caches; can be huge).
                              # Dependencies are still checked via requirements.txt / package-lock.json etc.
                              # Set to [] to scan everything (much slower).

trivy:
  enabled: true
  executable: null            # null = auto-detect (PATH, winget, scoop, choco)
  cache_dir: null             # null = Trivy default (%LOCALAPPDATA%\trivy)
  scan_types: [fs]            # fs (vuln/misconfig/secret/license via `scanners`) and/or config
  scanners: [vuln, misconfig, secret]   # add `license` for license findings
  skip_dirs: []               # glob patterns passed to --skip-dirs, e.g. ['**/testdata']
  generate_sbom: false        # write a CycloneDX SBOM per repository per scan
  images: {}                  # repository name -> list of local/remote image refs, e.g. {Backend: ['backend:latest']}
  installed_versions: true    # also check exact versions installed in each project's .venv / venv / node_modules
                              # (package metadata only; covers libraries listed without an exact version)

gitleaks:
  enabled: true
  executable: null
  modes: [git, dir]           # git = commit history, dir = current working tree (incl. untracked files)
  config_path: null           # custom gitleaks.toml (allowlists etc.)
  log_opts: null              # e.g. '--all' to scan every branch
  max_target_megabytes: null  # skip files larger than this

sast:                         # code scan (static analysis) of your own Python code with Bandit
  enabled: true
  skip_tests: []              # Bandit check IDs to skip, e.g. [B101] for assert statements
  other_languages: true       # also check JavaScript/TypeScript, HTML templates, PHP, Java, Go and C# (built in)

dast:                         # web scan (dynamic testing) of your own RUNNING apps; built in, nothing to install
  enabled: true
  allowed_hosts: []           # outside websites you are AUTHORISED to test, exact host names, e.g. [staging.example.com]
                              # (then paste https://staging.example.com/ in the dashboard, or: run_scan.py vapt <url>)
  targets: []                 # localhost / 127.0.0.1 / ::1, or a host in allowed_hosts, for example:
  #  - repository: my-flask-app         # project that serves the app (name as shown on the Repositories page)
  #    url: http://127.0.0.1:5000/      # the app must be running when the scan starts, otherwise it is skipped
  #    start_command: python app.py     # optional: started when nothing answers, stopped again after the scan
  #    start_dir: ''                    # optional: folder inside the project to run it in, e.g. landing-page
  #    start_wait: 60                   # seconds to wait for the app to answer
  #    openapi: api/openapi.yaml        # optional: API description (file, or a path on the app like /openapi.json)
  #    api_post_allowed: [/api/predict] # optional: API paths that may get POST tests (calculate only, store nothing)
  #    login:                           # optional: also test pages behind sign-in, with a TEST account
  #      url: http://127.0.0.1:5000/login
  #      username: test-user
  #      password_env: LSS_MYAPP_PASSWORD   # NAME of an environment variable holding the password (never the password)
  #      username_field: ''             # optional: form field names, detected automatically when empty
  #      password_field: ''
  #      logged_in_text: ''             # optional: text that only appears when signed in
  max_pages: 30               # pages followed per address
  max_requests: 400           # requests sent per address (GET only; forms that change data are never submitted)
  request_timeout: 10         # seconds to wait for one response

report:                       # branding of the VAPT report (PDF)
  logo_path: ''               # e.g. data/branding/logo.svg (.svg/.png/.jpg) - shown at the top of every page
  organisation: ''            # optional name shown next to the logo

dashboard:
  host: 127.0.0.1             # loopback only; other values are rejected
  port: 8501

schedule:
  time: '02:00'
  weekly_day: SUN
